[project]
name = "classical-nlp"
version = "0.1.0"
description = "TF-IDF vs embeddings on multilingual text, with topic modelling and honest evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.6",
    "scipy>=1.14",
]

# Most projects here ship a CLI. Entry points REQUIRE a real build backend —
# a uv virtual project ([tool.uv] package = false) installs nothing, so the
# documented command fails with "No module named ..." even while tests pass
# (pytest's pythonpath hides it). Bit us on A1, nearly again on A3.
# No-CLI projects (static sites, notebooks-only): delete [project.scripts];
# the build backend is harmless to keep.
[project.scripts]
classical-nlp = "classicalnlp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠️ When /new-project renames src/classicalnlp, update BOTH the line below AND the
# [project.scripts] target above.
[tool.hatch.build.targets.wheel]
packages = ["src/classicalnlp"]

[project.optional-dependencies]
# Deliberately optional: a 90 MB model download and a torch dependency have no business
# being required by a project about what happens below the API layer.
embeddings = [
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: needs the 20 Newsgroups download (cached after the first run)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 flag "ambiguous" non-ASCII characters -- Devanagari and Kannada digits that
# look like Latin letters. In a project about handling those scripts correctly, the
# characters in the docstrings and tests are the subject matter, not a typo.
ignore = ["RUF001", "RUF002", "RUF003"]
